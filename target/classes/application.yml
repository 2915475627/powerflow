spring:
  application:
    name: powerflow

  datasource:
    url: jdbc:postgresql://localhost:5432/powerflow
    username: powerflow
    password: powerflow123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    com.powerflow: DEBUG
    org.springframework.web: INFO

persistence:
  type: jpa
